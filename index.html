          {
            "@type": "Question",
            "name": "DailyNewsPodcast는 무엇인가요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "DailyNewsPodcast는 직장인을 위한 자동화 워크플로우 팟캐스트 서비스입니다. 관심사만 입력하면 AI가 매일 웹을 크롤링하여 뉴스를 큐레이션하고 요약하여 맞춤형 팟캐스트로 전달합니다."

          },
          {
            "@type": "Question",
            "name": "DailyNewsPodcast는 어떻게 작동하나요?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "간단한 프롬프트로 관심사를 입력하세요. AI 에이전트가 수천 개의 소스를 크롤링하고, 관련 스토리를 선택하며, 매력적인 스크립트를 작성한 후 자연스러운 오디오로 변환하여 이메일이나 RSS 피드로 전달합니다."
            }
          },
          {
            "@type": "Question",
            "name": "Is DailyNewsPodcast free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes! DailyNewsPodcast offers a free tier with weekly podcasts. Premium plans starting at $19/month unlock daily podcasts, premium voices, and private RSS feeds."
            }
          },
          {
            "@type": "Question",
            "name": "Can I use my own podcast app?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Pro subscribers get a private RSS feed that works with Spotify, Apple Podcasts, and any podcast player you prefer."
            }
          }
        ]
      }
